<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLYANI</title>

    <!-- Preload fonts to eliminate layout shift on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Montserrat:wght@200;300&display=block" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Animated Background ── */
        /* Layer 1: slow diagonal drift — top-right to bottom-left */
        body::before {
            content: '';
            position: fixed;
            inset: -20%;
            width: 140%;
            height: 140%;
            background: linear-gradient(
                135deg,
                #181818 0%,
                #0c0c0c 25%,
                #000    50%,
                #0c0c0c 75%,
                #000    100%
            );
            background-size: 200% 200%;
            pointer-events: none;
            z-index: 0;
            animation: bgDrift 18s ease-in-out infinite alternate;
        }

        /* Layer 2: soft breathing radial at top-right */
        body::after {
            content: '';
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, #1c1c1c 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            0%   { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes breathe {
            0%   { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1;   transform: scale(1.15); }
        }

        /* ── Container ── */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 24px;
            visibility: hidden; /* shown only after fonts load */
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            margin: 0 auto;
        }

        /* ── Title — slightly smaller ── */
        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3.2rem, 7.5vw, 6.5rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            margin-right: -0.22em;
            line-height: 1;
            text-transform: uppercase;
            background: linear-gradient(135deg,
                #555 0%, #fff 18%, #888 38%,
                #fff 53%, #777 68%, #fff 83%, #aaa 100%);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: scale(1.06);
            will-change: transform, opacity;
        }

        .title.reveal {
            animation:
                titleReveal 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                shimmer 14s linear 2.8s infinite;
        }

        /* ── Tagline ── */
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.68rem, 1.05vw, 0.72rem);
            font-weight: 300;
            color: #777;
            text-transform: uppercase;
            margin-top: 1.3rem;
            display: flex;
            width: 100%;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(10px);
            will-change: transform, opacity;
        }

        .tagline.reveal {
            animation: slideUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .spacer { width: 1.4em; }

        /* ── Divider ── */
        .divider {
            width: 1px;
            height: 0;
            background: linear-gradient(to bottom, rgba(150,150,150,0.4), transparent);
            margin: 2.2rem 0;
            will-change: height;
        }

        .divider.reveal {
            animation: growLine 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Coming Soon ── */
        .coming-soon {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 200;
            color: #bbb;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(8px);
            will-change: transform, opacity;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .coming-soon.reveal {
            animation: slideUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ── Keyframes ── */
        @keyframes titleReveal {
            from { opacity: 0; transform: scale(1.06); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            from { background-position: 200% center; }
            to   { background-position: -200% center; }
        }

        @keyframes growLine {
            from { height: 0; }
            to   { height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="logo-group">
            <h1 class="title" id="title" aria-label="KLYANI">KLYΛNI</h1>
            <div class="tagline" id="tagline" aria-label="Fashion Beyond Ordinary">
                <span>F</span><span>A</span><span>S</span><span>H</span><span>I</span><span>O</span><span>N</span>
                <span class="spacer"></span>
                <span>B</span><span>E</span><span>Y</span><span>O</span><span>N</span><span>D</span>
                <span class="spacer"></span>
                <span>O</span><span>R</span><span>D</span><span>I</span><span>N</span><span>A</span><span>R</span><span>Y</span>
            </div>
        </div>

        <div class="divider" id="divider"></div>

        <div class="coming-soon" id="comingSoonEl">
            <span>C</span><span>O</span><span>M</span><span>I</span><span>N</span><span>G</span>
            <span class="spacer"></span>
            <span>S</span><span>O</span><span>O</span><span>N</span>
        </div>
    </div>

    <script>
    (function () {

        // ── Audio ────────────────────────────────────────────────────────
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        let soundPlayed = false;

        // Forcefully attempt to unlock audio immediately (works on localhost usually)
        if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
        }

        function playPremiumIntro() {
            if (ctx.state !== 'running' || soundPlayed) return;
            soundPlayed = true;

            const t = ctx.currentTime;

            // Premium brand soft electric piano/bell arpeggio (Cmaj9)
            // Frequencies: C3, E3, G3, B3, D4, G4
            const freqs = [130.81, 164.81, 196.00, 246.94, 293.66, 392.00]; 
            const masterGain = ctx.createGain();
            
            masterGain.gain.setValueAtTime(0.9, t);
            masterGain.connect(ctx.destination);

            freqs.forEach((freq, i) => {
                const delay = i * 0.15; // Beautiful rolling arpeggio
                const startTime = t + delay;
                
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);
                
                // FM synthesis for a soft Rhodes/Bell piano strike sound
                const mod = ctx.createOscillator();
                mod.type = 'sine';
                mod.frequency.setValueAtTime(freq * 4, startTime); 
                
                const modGain = ctx.createGain();
                modGain.gain.setValueAtTime(freq * 1.5, startTime);
                modGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                
                mod.connect(modGain);
                modGain.connect(osc.frequency);
                
                // Note envelope (soft attack, long natural piano decay)
                const env = ctx.createGain();
                env.gain.setValueAtTime(0, startTime);
                env.gain.linearRampToValueAtTime(1.0, startTime + 0.05); 
                env.gain.exponentialRampToValueAtTime(0.001, startTime + 6); 
                
                // Stereo spread
                const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
                if (panner.pan) {
                    panner.pan.setValueAtTime((i % 2 === 0 ? -1 : 1) * 0.5, startTime);
                }
                
                osc.connect(env);
                env.connect(panner);
                panner.connect(masterGain);
                
                mod.start(startTime);
                osc.start(startTime);
                mod.stop(startTime + 7);
                osc.stop(startTime + 7);
            });
            
            // Add a very soft, deep bass swell (C2) to ground the intro
            const bass = ctx.createOscillator();
            bass.type = 'sine';
            bass.frequency.setValueAtTime(65.41, t);
            const bassGain = ctx.createGain();
            bassGain.gain.setValueAtTime(0, t);
            bassGain.gain.linearRampToValueAtTime(0.6, t + 1);
            bassGain.gain.exponentialRampToValueAtTime(0.001, t + 8);
            bass.connect(bassGain);
            bassGain.connect(masterGain);
            bass.start(t);
            bass.stop(t + 8);
        }

        let revealStarted = false;

        // Fallback: If browser strictly blocks autoplay, unlock on ANY interaction
        ['click','keydown','touchstart','pointerdown','mousemove'].forEach(e =>
            window.addEventListener(e, () => {
                if (ctx.state === 'suspended') {
                    ctx.resume().then(() => {
                        if (revealStarted) playPremiumIntro();
                    });
                } else if (revealStarted) {
                    playPremiumIntro();
                }
            }, { once: true, passive: true })
        );

        // ── Cinematic Reveal (waits for fonts to prevent jump) ───────────
        document.fonts.ready.then(() => {
            const container = document.getElementById('container');
            const titleEl   = document.getElementById('title');
            const taglineEl = document.getElementById('tagline');
            const dividerEl = document.getElementById('divider');
            const comingSoonEl = document.getElementById('comingSoonEl');

            container.style.visibility = 'visible';

            titleEl.classList.add('reveal');
            setTimeout(() => taglineEl.classList.add('reveal'), 2000);
            setTimeout(() => dividerEl.classList.add('reveal'), 3200);
            setTimeout(() => {
                revealStarted = true;
                comingSoonEl.classList.add('reveal');
                // Attempt to play immediately without click
                playPremiumIntro(); 
            }, 4400);
        });

    })();
    </script>
</body>
</html>
