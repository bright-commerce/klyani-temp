<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLYANI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Montserrat:wght@200;300&display=block" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Animated Background ── */
        /* Layer 1: slow diagonal drift — top-right to bottom-left */
        body::before {
            content: '';
            position: fixed;
            inset: -20%;
            width: 140%;
            height: 140%;
            background: linear-gradient(
                135deg,
                #181818 0%,
                #0c0c0c 25%,
                #000    50%,
                #0c0c0c 75%,
                #000    100%
            );
            background-size: 200% 200%;
            pointer-events: none;
            z-index: 0;
            animation: bgDrift 18s ease-in-out infinite alternate;
        }

        /* Layer 2: soft breathing radial at top-right */
        body::after {
            content: '';
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, #1c1c1c 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            0%   { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes breathe {
            0%   { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1;   transform: scale(1.15); }
        }

        /* ── Container ── */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 24px;
            visibility: hidden; /* shown only after fonts load */
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            margin: 0 auto;
        }

        /* ── Title — slightly smaller ── */
        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 7.5vw, 6.5rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            margin-right: -0.22em;
            line-height: 1;
            text-transform: uppercase;
            background: linear-gradient(135deg,
                #555 0%, #fff 18%, #888 38%,
                #fff 53%, #777 68%, #fff 83%, #aaa 100%);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: scale(1.06);
            will-change: transform, opacity;
        }

        .title.reveal {
            animation:
                titleReveal 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                shimmer 14s linear 2.8s infinite;
        }

        /* ── Tagline ── */
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.42rem, 1.05vw, 0.72rem);
            font-weight: 300;
            color: #777;
            text-transform: uppercase;
            margin-top: 1.3rem;
            display: flex;
            width: 100%;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(10px);
            will-change: transform, opacity;
        }

        .tagline.reveal {
            animation: slideUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .spacer { width: 1.4em; }

        /* ── Divider ── */
        .divider {
            width: 1px;
            height: 0;
            background: linear-gradient(to bottom, rgba(150,150,150,0.4), transparent);
            margin: 2.2rem 0;
            will-change: height;
        }

        .divider.reveal {
            animation: growLine 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── Timer ── */
        .timer {
            display: flex;
            gap: clamp(0.8rem, 2.5vw, 2rem);
            align-items: center;
            opacity: 0;
            transform: translateY(8px);
            will-change: transform, opacity;
        }

        .timer.reveal {
            animation: slideUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .time-number {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.05rem, 2.8vw, 1.7rem);
            font-weight: 200;
            background: linear-gradient(to bottom, #fff 0%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.05em;
            min-width: 2ch;
            text-align: center;
        }

        .time-label {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.28rem, 0.6vw, 0.37rem);
            font-weight: 300;
            color: #444;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .time-sep {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 200;
            color: #2a2a2a;
            margin-bottom: 0.8rem;
        }

        /* ── Keyframes ── */
        @keyframes titleReveal {
            from { opacity: 0; transform: scale(1.06); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            from { background-position: 200% center; }
            to   { background-position: -200% center; }
        }

        @keyframes growLine {
            from { height: 0; }
            to   { height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="logo-group">
            <h1 class="title" id="title" aria-label="KLYANI">KLYΛNI</h1>
            <div class="tagline" id="tagline" aria-label="Fashion Beyond Ordinary">
                <span>F</span><span>A</span><span>S</span><span>H</span><span>I</span><span>O</span><span>N</span>
                <span class="spacer"></span>
                <span>B</span><span>E</span><span>Y</span><span>O</span><span>N</span><span>D</span>
                <span class="spacer"></span>
                <span>O</span><span>R</span><span>D</span><span>I</span><span>N</span><span>A</span><span>R</span><span>Y</span>
            </div>
        </div>

        <div class="divider" id="divider"></div>

        <div class="timer" id="timerEl">
            <div class="time-unit">
                <span class="time-number" id="days">07</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-sep">:</div>
            <div class="time-unit">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Hrs</span>
            </div>
            <div class="time-sep">:</div>
            <div class="time-unit">
                <span class="time-number" id="mins">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="time-sep">:</div>
            <div class="time-unit">
                <span class="time-number" id="secs">00</span>
                <span class="time-label">Sec</span>
            </div>
        </div>
    </div>

    <script>
    (function () {

        // ── Audio ────────────────────────────────────────────────────────
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        function playTick() {
            if (ctx.state !== 'running') return;
            const t = ctx.currentTime;

            const o1 = ctx.createOscillator(), g1 = ctx.createGain();
            o1.type = 'triangle';
            o1.frequency.setValueAtTime(880, t);
            o1.frequency.exponentialRampToValueAtTime(120, t + 0.07);
            g1.gain.setValueAtTime(0.18, t);
            g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
            o1.connect(g1); g1.connect(ctx.destination);
            o1.start(t); o1.stop(t + 0.15);

            const o2 = ctx.createOscillator(), g2 = ctx.createGain();
            o2.type = 'sine';
            o2.frequency.value = 3000;
            g2.gain.setValueAtTime(0.07, t);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
            o2.connect(g2); g2.connect(ctx.destination);
            o2.start(t); o2.stop(t + 0.04);
        }

        ['click','keydown','touchstart','pointerdown'].forEach(e =>
            window.addEventListener(e, () => {
                if (ctx.state === 'suspended') ctx.resume();
            }, { once: true, passive: true })
        );

        // ── Countdown ────────────────────────────────────────────────────
        const year   = new Date().getFullYear();
        const target = new Date(`September 14, ${year} 00:00:00`).getTime();

        const dEl = document.getElementById('days');
        const hEl = document.getElementById('hours');
        const mEl = document.getElementById('mins');
        const sEl = document.getElementById('secs');

        function tick() {
            const diff = target - Date.now();
            if (diff < 0) return;
            dEl.textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
            hEl.textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
            mEl.textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
            sEl.textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            playTick();
        }

        // ── Cinematic Reveal (waits for fonts to prevent jump) ───────────
        document.fonts.ready.then(() => {
            const container = document.getElementById('container');
            const titleEl   = document.getElementById('title');
            const taglineEl = document.getElementById('tagline');
            const dividerEl = document.getElementById('divider');
            const timerEl   = document.getElementById('timerEl');

            container.style.visibility = 'visible';

            titleEl.classList.add('reveal');
            setTimeout(() => taglineEl.classList.add('reveal'), 2000);
            setTimeout(() => dividerEl.classList.add('reveal'), 3200);
            setTimeout(() => {
                timerEl.classList.add('reveal');
                tick();
                setTimeout(() => {
                    tick();
                    setInterval(tick, 1000);
                }, 1000 - (Date.now() % 1000));
            }, 4400);
        });

    })();
    </script>
</body>
</html>
